# ExpenseTracker 用 nginx 設定（EC2）。
#
# 役割:
#   - /        : Nuxt の静的SPA（nuxt generate の出力）を配信
#   - /api/    : Go API（127.0.0.1:8080, systemd）へリバースプロキシ
#   フロントと API が同一オリジンになるため CORS 不要。
#
# 配置先: /etc/nginx/sites-available/expense-tracker.conf
# 有効化:
#   sudo ln -sf /etc/nginx/sites-available/expense-tracker.conf /etc/nginx/sites-enabled/expense-tracker.conf
#   sudo rm -f /etc/nginx/sites-enabled/default   # 既定サイトを無効化
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Nuxt 静的SPA の配置先（deploy.sh が nuxt generate の出力をここへ配置する）
    root /var/www/expense-tracker;
    index index.html;

    # 大きめのリクエストにも対応（取引の一括登録などを見越して）
    client_max_body_size 2m;

    # API は Go バックエンドへプロキシ
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA ルーティング: 実ファイルが無ければ index.html を返す
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静的アセットは長めにキャッシュ（ハッシュ付きファイル名のため安全）
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
